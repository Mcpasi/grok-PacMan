<!--
Logic and styles have been separated from index.html and moved into their own files.
I noticed a bug: on mobile devices, you cannot move the game character.
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>grok-PacMan</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/ui.css">
<script src="scripts/audio.js" defer></script>
<script src="scripts/maze.js" defer></script>
<script src="scripts/state.js" defer></script>
<script src="scripts/game.js" defer></script>
<script src="scripts/input.js" defer></script>
<script src="scripts/ui.js" defer></script>
<script src="scripts/movement.js" defer></script>
<script src="scripts/rendering.js" defer></script>
<script src="scripts/main.js" defer></script>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="score">SCORE: 0</div>
    <div id="highScore">HIGH: 0</div>
  </div>
  <div id="lives"></div>
  <div id="overlay">
    <h1>GROK-PACMAN</h1>
    <p>Arrow keys or WASD to move</p>
    <p>P or Esc to pause</p>
    <button id="startBtn">START GAME</button>
  </div>
</div>

</body>
</html>
